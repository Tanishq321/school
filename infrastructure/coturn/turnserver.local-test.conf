# LOCAL TESTING ONLY. Loopback TURN used by the E2E suite to force media through the relay.
# Never use in production: it allows loopback peers and has no TLS.
listening-ip=127.0.0.1
relay-ip=127.0.0.1
listening-port=3478
min-port=50000
max-port=50200
fingerprint
use-auth-secret
static-auth-secret=e2e-turn-secret-0123456789abcdef0123456789
realm=localhost
allow-loopback-peers
no-tls
no-dtls
no-cli
no-multicast-peers
simple-log
log-file=stdout
