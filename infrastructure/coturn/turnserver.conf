# coturn production configuration for the video platform.
# Install: see docs/deployment.md. Copy to /etc/turnserver.conf and replace every CHANGE_ME.
#
# Auth model: TURN REST API (HMAC, time-limited). The backend mints credentials with the same
# secret (TURN_SECRET); browsers never see the secret, and credentials expire on their own.

# ---- Listening ------------------------------------------------------------
listening-port=3478
tls-listening-port=5349
# If this box has a public IP behind 1:1 NAT (AWS, GCP, many VPS), set PUBLIC/PRIVATE:
#   external-ip=203.0.113.10/10.0.0.5
# On a VPS with the public IP on the interface, the public IP alone is enough:
external-ip=CHANGE_ME_PUBLIC_IP

# Relay port range. MUST match the firewall (UDP 49152-65535 open inbound).
min-port=49152
max-port=65535

# ---- Authentication ---------------------------------------------------------
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_SAME_AS_BACKEND_TURN_SECRET
realm=turn.CHANGE_ME_DOMAIN
server-name=turn.CHANGE_ME_DOMAIN
# Reject credentials whose embedded expiry is in the past (default) and refresh nonces often.
stale-nonce=600

# ---- TLS (turns: on 5349; lets clients behind HTTPS-only firewalls connect) -----
cert=/etc/letsencrypt/live/turn.CHANGE_ME_DOMAIN/fullchain.pem
pkey=/etc/letsencrypt/live/turn.CHANGE_ME_DOMAIN/privkey.pem
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"
dh2066

# ---- Abuse limits ----------------------------------------------------------------
# Max allocations per credential and in total; bps caps per session (~2.5 Mbps).
user-quota=12
total-quota=1200
max-bps=320000
no-multicast-peers
no-cli
no-tcp-relay

# Never relay into private / internal networks (prevents using TURN to reach your LAN, metadata services, etc.)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Phase 2 (mediasoup on the same host/private network): explicitly allow its address, e.g.
#   allowed-peer-ip=10.0.0.5

# ---- Logging & monitoring -------------------------------------------------------
log-file=/var/log/turnserver/turnserver.log
simple-log
# Prometheus metrics on 127.0.0.1:9641 (scraped locally; do not expose publicly)
prometheus
